# Chassis footprint in base_footprint coordinates.  It includes the tracks,
# the folded arm projection and a small physical safety margin.
footprint:
  - [-0.50, -0.22]
  - [-0.50,  0.22]
  - [ 0.78,  0.22]
  - [ 0.78, -0.22]
footprint_padding: 0.03
transform_tolerance: 0.30

obstacle_layer:
  enabled: true
  observation_sources: scan
  scan:
    topic: /scan
    sensor_frame: base_laser
    data_type: LaserScan
    marking: true
    clearing: true
    inf_is_valid: true
    obstacle_range: 3.0
    raytrace_range: 3.5
    min_obstacle_height: 0.0
    max_obstacle_height: 2.0

inflation_layer:
  enabled: true
  inflation_radius: 0.32
  cost_scaling_factor: 6.0
