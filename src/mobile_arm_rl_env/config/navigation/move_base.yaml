base_global_planner: "global_planner/GlobalPlanner"
base_local_planner: "dwa_local_planner/DWAPlannerROS"

planner_frequency: 1.0
planner_patience: 5.0
controller_frequency: 10.0
controller_patience: 3.0
shutdown_costmaps: false
# At 0.125 rad/s a normal 90-degree in-place turn takes about 12.6 s.
# move_base's displacement-only oscillation watchdog would abort that valid
# tracked-base maneuver, so leave timeout detection to DWA and the cmd bridge.
oscillation_timeout: 0.0
oscillation_distance: 0.08

# Custom blind recovery motions are intentionally disabled.  DWA remains the
# only source of motion and the bridge watchdog stops stale commands.
recovery_behavior_enabled: false
clearing_rotation_allowed: false

GlobalPlanner:
  allow_unknown: true
  use_dijkstra: true
  use_quadratic: true
  use_grid_path: false
  old_navfn_behavior: false
  orientation_mode: 1
